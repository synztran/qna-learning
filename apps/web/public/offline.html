<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">

    <title>Không có kết nối · QnA Learning</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #FDFBF7; color: #1C2A23; }

      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
      main { max-width: 30rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.75rem; margin: 24px 0 12px; }
      p { line-height: 1.65; }
      a { display: inline-block; margin-top: 12px; padding: 14px 24px; background: #52796F; color: white; border-radius: 12px; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { background: #141E19; color: #F3F1EC; } a { background: #84A98C; color: #141E19; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72">

      <a href="/">Thử kết nối lại</a>
